name: Validate protocol
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typespec/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: typespec
      - run: python tools/build_openapi.py --check
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -p 'test_reference.py'
      - run: python -m unittest discover -s tests -p 'test_conformance.py'
      - run: git diff --check
