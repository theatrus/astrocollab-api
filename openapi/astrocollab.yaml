openapi: 3.1.0
info:
  title: AstroCollab API
  version: 0.2.0-draft.1
  license:
    name: MIT
    identifier: MIT
  description: 'Draft API for collaborative astrophotography. A telescope''s software signs in, describes

    the rig, asks what to shoot tonight and reports what it captured. This version adopts the

    protocol Starfront already speaks. See spec/protocol.md for the rules behind each route.'
tags:
- name: discovery
- name: signin
- name: telescopes
- name: telescope
paths:
  /api/v1/agent/hello:
    post:
      operationId: hello
      summary: Say hello and describe the rig
      description: 'Says what this telescope is and, if it likes, where it points. Also a heartbeat. Send
        it

        before asking for work and whenever the rig changes.'
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
              examples:
                example:
                  value:
                    agent: '000000000001'
                    name: Vega 530
                    protocol: 1
                    serverTime: 1791171023.0
        '401':
          description: Missing, unknown or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflicts with how things stand, such as a rig that cannot meet a project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match its type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
      tags:
      - telescope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelloRequest'
            examples:
              example:
                value:
                  protocol: 1
