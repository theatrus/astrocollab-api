      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - recommendation
          - assessment
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        poll_after_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        result:
          oneOf:
          - $ref: '#/components/schemas/Recommendation'
          - $ref: '#/components/schemas/Submission'
        error:
          $ref: '#/components/schemas/Problem'
      required:
      - id
      - kind
      - state
      - poll_after_seconds
      allOf:
      - if:
          properties:
            state:
              const: succeeded
        then:
          required:
          - result
          not:
            required:
            - error
      - if:
          properties:
            state:
              const: failed
        then:
          required:
          - error
          not:
            required:
            - result
      - if:
          properties:
            state:
              enum:
              - queued
              - running
        then:
          not:
            anyOf:
            - required:
              - result
            - required:
              - error
      - if:
          properties:
            kind:
              const: recommendation
        then:
          properties:
            result:
              $ref: '#/components/schemas/Recommendation'
      - if:
          properties:
            kind:
              const: assessment
        then:
          properties:
            result:
              $ref: '#/components/schemas/Submission'
