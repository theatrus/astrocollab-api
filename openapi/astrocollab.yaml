        allow_drizzle:
          type: boolean
          description: Whether drizzled masters are accepted. Sampling rules apply to the master's pixels.
      description: What a stacked master must meet, beyond the objective's own rules.
      additionalProperties: false
    Measurement:
      type: object
      required:
      - metric
      - method
      - method_version
      - unit
      - value
      - measured_at
      properties:
        metric:
          $ref: '#/components/schemas/Text'
        method:
          $ref: '#/components/schemas/Text'
        method_version:
          $ref: '#/components/schemas/Text'
        unit:
          $ref: '#/components/schemas/Text'
        value:
          type: number
        measured_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    MetricRule:
      type: object
      required:
      - metric
      - method
      - method_version
      - unit
      - required
      properties:
        metric:
          type: string
          pattern: ^[a-z][a-z0-9_.-]+$
        method:
          $ref: '#/components/schemas/Text'
        method_version:
          $ref: '#/components/schemas/Text'
        unit:
          $ref: '#/components/schemas/Text'
        required:
          type: boolean
        min_value:
          type: number
        max_value:
          type: number
      anyOf:
      - required:
        - min_value
      - required:
        - max_value
      additionalProperties: false
    MyProject:
      type: object
      required:
      - project_id
      - title
      - state
      - membership
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        title:
          $ref: '#/components/schemas/Text'
        state:
          type: string
          enum:
          - open
          - paused
          - closed
        membership:
          type: string
          enum:
          - requested
          - active
          - paused
          - withdrawn
          - revoked
          description: Only `active` members can submit or receive assignments.
      description: A project the account has joined, and the account's standing in it.
      additionalProperties: false
    MyProjectPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyProject'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          maxLength: 4096
      additionalProperties: false
    Objective:
      type: object
      required:
      - id
      - target_id
      - processing_group_id
      - bandpasses
      - purpose
      - exposure
      - goal
      - minimum_coverage_fraction
      - fresh_pixel_solve
      - quality_rules
      - required_features
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        target_id:
          $ref: '#/components/schemas/Uuid'
        processing_group_id:
          $ref: '#/components/schemas/Uuid'
        bandpasses:
          type: array
          items:
            $ref: '#/components/schemas/Bandpass'
          minItems: 1
          maxItems: 8
          description: Accepted passbands. A frame qualifies when one of its passbands matches one of
            these.
        purpose:
          type: string
          enum:
          - deep
          - short_dynamic_range
          - continuum
          - other
        exposure:
          $ref: '#/components/schemas/ExposureRange'
        goal:
          $ref: '#/components/schemas/Goal'
        minimum_coverage_fraction:
          type: number
          minimum: 0
          maximum: 1
        fresh_pixel_solve:
          type: boolean
        quality_rules:
          type: array
          items:
            $ref: '#/components/schemas/MetricRule'
          minItems: 0
          maxItems: 32
        required_features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureName'
          minItems: 0
          maxItems: 32
      additionalProperties: false
    PairRequest:
      type: object
      required:
      - pairing_code
      - installation_id
      - client_name
      properties:
        pairing_code:
          type: string
          minLength: 16
          maxLength: 256
          description: Single-use code the user issued on the account pages.
        installation_id:
          $ref: '#/components/schemas/Uuid'
          description: Persistent ID of this client installation. Pairing again replaces its old key.
        client_name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name shown on the account pages, such as "Roof rig 2".
      description: Trade a pairing code from the account pages for an API key.
      additionalProperties: false
    PairedKey:
      type: object
      required:
      - key_id
      - api_key
      - account_id
      - client_name
      - installation_id
      properties:
        key_id:
          $ref: '#/components/schemas/Uuid'
        api_key:
          type: string
          minLength: 32
          maxLength: 512
          description: 'Send as `Authorization: Bearer <api_key>`. Store it in a credential store.'
        account_id:
          $ref: '#/components/schemas/Uuid'
        client_name:
          type: string
          minLength: 1
          maxLength: 80
        installation_id:
          $ref: '#/components/schemas/Uuid'
        project_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
          description: Present when the user limited the key to these projects.
          uniqueItems: true
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Present when the user set an expiry.
        equipment_id:
          $ref: '#/components/schemas/Uuid'
          description: Present when the user issued the code for a rig set up on the web pages.
      description: A new API key. The secret appears only in this response.
      additionalProperties: false
    Panel:
      type: object
      required:
      - id
      - target_id
      - objective_ids
      - footprint
      - overlap_fraction
      - equipment
      - filter_id
      - exposure_seconds
      - suggested_frames
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        target_id:
          $ref: '#/components/schemas/Uuid'
        target_name:
          $ref: '#/components/schemas/Text'
          description: The target's name, for display.
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
        footprint:
          $ref: '#/components/schemas/Footprint'
          description: 'The camera field to point at: center, size and angle. It fits the rig''s field
            of view.'
        layout:
          $ref: '#/components/schemas/PanelLayout'
          description: Where this panel sits when the server splits the target into a grid.
        overlap_fraction:
          type: number
          minimum: 0
          maximum: 0.9
        equipment:
          $ref: '#/components/schemas/EquipmentRef'
        filter_id:
          $ref: '#/components/schemas/Uuid'
        exposure_seconds:
          type: number
          maximum: 86400
          exclusiveMinimum: 0
        suggested_frames:
          type: integer
          minimum: 1
      description: 'One field to image: where to point, which filter, how long and how many frames.'
      additionalProperties: false
    PanelLayout:
      type: object
      required:
      - columns
      - rows
      - column
      - row
      properties:
        columns:
          type: integer
          minimum: 1
          maximum: 100
        rows:
          type: integer
          minimum: 1
          maximum: 100
        column:
          type: integer
          minimum: 1
          maximum: 100
        row:
          type: integer
          minimum: 1
          maximum: 100
      description: A panel's place in the grid the server laid over a target. Columns run east to west.
      additionalProperties: false
    PartReceipt:
      type: object
      required:
      - part_number
      - size_bytes
      - sha256
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
      additionalProperties: false
    Position:
      type: object
      required:
      - ra_degrees
      - dec_degrees
      properties:
        ra_degrees:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        dec_degrees:
          type: number
          minimum: -90
          maximum: 90
      additionalProperties: false
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          $ref: '#/components/schemas/Text'
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/Code'
        detail:
          $ref: '#/components/schemas/Text'
        request_id:
          $ref: '#/components/schemas/Uuid'
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                $ref: '#/components/schemas/Text'
              code:
                $ref: '#/components/schemas/Text'
            required:
            - pointer
            - code
            additionalProperties: false
          minItems: 0
          maxItems: 100
      additionalProperties: false
    ProcessingGroup:
      type: object
      required:
      - id
      - name
      - sampling_arcsec_per_pixel
      - color_state
      - registration
      - linear
      - required_calibration_steps
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/Text'
        sampling_arcsec_per_pixel:
          $ref: '#/components/schemas/Range'
        color_state:
          type: string
          enum:
          - mono
          - cfa
          - debayered_rgb
        registration:
          type: string
          enum:
          - unregistered
          - registered
        linear:
          type: boolean
          enum:
          - true
        required_calibration_steps:
          type: array
          items:
            type: string
            enum:
            - bias_subtract
            - dark_subtract
            - flat_correct
            - dark_flat_correct
          minItems: 1
          maxItems: 4
      additionalProperties: false
    Progress:
      type: object
      required:
      - project_id
      - revision
      - as_of
      - objectives
      - accepted_frames
      - accepted_integration_seconds
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
        as_of:
          $ref: '#/components/schemas/Timestamp'
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/ProgressObjective'
          minItems: 0
          maxItems: 100
        accepted_frames:
          type: integer
          minimum: 0
        accepted_integration_seconds:
          type: number
          minimum: 0
      description: How far the shared picture has come. Counts are subs, whether sent alone or in masters.
      additionalProperties: false
    ProgressObjective:
      type: object
      required:
      - objective_id
      - goal
      - assigned_frames
      - reported_frames
      - pending_frames
      - accepted_frames
      - accepted_integration_seconds
      - rejected_frames
      - surplus_frames
      - complete
      properties:
        objective_id:
          $ref: '#/components/schemas/Uuid'
        goal:
          $ref: '#/components/schemas/Goal'
        assigned_frames:
          type: integer
          minimum: 0
          description: Frames in unexpired assignments.
        reported_frames:
          type: integer
          minimum: 0
          description: Frames rigs report as captured but not yet submitted. They earn no credit until
            accepted.
        pending_frames:
          type: integer
          minimum: 0
          description: Frames uploaded and not yet assessed.
        accepted_frames:
          type: integer
          minimum: 0
        accepted_integration_seconds:
          type: number
          minimum: 0
        rejected_frames:
          type: integer
          minimum: 0
        surplus_frames:
          type: integer
          minimum: 0
          description: Accepted after the goal was met; credited to the contributor, not to the goal.
        complete:
          type: boolean
          description: True when every panel of the target has the goal's depth.
      additionalProperties: false
    Project:
      type: object
      required:
      - id
      - title
      - state
      - revision
      - published_at
      - requirements
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          $ref: '#/components/schemas/Text'
        state:
          type: string
          enum:
          - open
          - paused
          - closed
        revision:
          type: integer
          minimum: 1
          description: Rises each time the owners publish new requirements. Submissions cite it.
        published_at:
          $ref: '#/components/schemas/Timestamp'
        requirements:
          $ref: '#/components/schemas/RequirementSet'
      description: A project and its current requirements.
      additionalProperties: false
    Range:
      type: object
      required:
      - min
      - max
      properties:
        min:
          type: number
          minimum: 0
        max:
          type: number
          minimum: 0
      description: Inclusive range. Server MUST enforce min <= max.
      additionalProperties: false
    RequirementSet:
      type: object
      required:
      - title
      - description
      - targets
      - processing_groups
      - objectives
      - terms
      - capture_deadline
      - submission_deadline
      - required_features
      - deliverable
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          $ref: '#/components/schemas/Text'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
          minItems: 1
          maxItems: 100
        processing_groups:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingGroup'
          minItems: 1
          maxItems: 100
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/Objective'
          minItems: 1
          maxItems: 100
        terms:
          $ref: '#/components/schemas/Terms'
        capture_deadline:
          $ref: '#/components/schemas/Timestamp'
        submission_deadline:
          $ref: '#/components/schemas/Timestamp'
        required_features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureName'
          minItems: 0
          maxItems: 32
        deliverable:
          type: string
          enum:
          - calibrated_subs
          - stacked_masters
          description: 'What contributors submit: calibrated subs, or masters they stack themselves.'
        master_rules:
          $ref: '#/components/schemas/MasterRules'
          description: Rules for stacked masters. Required when `deliverable` is `stacked_masters`.
        external_delivery:
          $ref: '#/components/schemas/ExternalDelivery'
          description: Present when the project accepts files shared outside the API.
        extensions:
          type: object
          unevaluatedProperties: {}
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)+$
      description: What the project needs. Owners set it with the server's own tools.
      allOf:
      - if:
          properties:
            deliverable:
              const: stacked_masters
        then:
          required:
          - master_rules
        else:
          not:
            required:
            - master_rules
      additionalProperties: false
    ServiceUrl:
      type: string
      format: uri
      pattern: ^(https://|http://(127\.0\.0\.1|localhost|\[::1\])(:[0-9]+)?(/|$))
      description: HTTPS, or plain HTTP on a loopback address for local development.
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    Site:
      type: object
      required:
      - latitude_degrees
      - longitude_degrees
      - precision_km
      - timezone
      properties:
        latitude_degrees:
          type: number
          minimum: -90
          maximum: 90
        longitude_degrees:
          type: number
          minimum: -180
          maximum: 180
        precision_km:
          type: number
          minimum: 0
        timezone:
          $ref: '#/components/schemas/Text'
      additionalProperties: false
    SiteMergePatchUpdateOrCreate:
      type: object
      properties:
        latitude_degrees:
          type: number
          minimum: -90
          maximum: 90
        longitude_degrees:
          type: number
          minimum: -180
          maximum: 180
        precision_km:
          type: number
          minimum: 0
        timezone:
          $ref: '#/components/schemas/Text'
      additionalProperties: false
    SolveEvidence:
      type: object
      required:
      - source
      - artifact_sha256
      - center
      - method
      - method_version
      - measured_at
      properties:
        source:
          type: string
          enum:
          - fresh_pixel_solve
          - embedded_wcs
        artifact_sha256:
          $ref: '#/components/schemas/Sha256'
        center:
          $ref: '#/components/schemas/Position'
        method:
          $ref: '#/components/schemas/Text'
        method_version:
          $ref: '#/components/schemas/Text'
        measured_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    Stack:
      type: object
      required:
      - sub_count
      - integration_seconds
      - first_captured_at
      - last_captured_at
      - subs
      - registration
      - normalization
      - rejection
      - weighting
      - software
      - version
      properties:
        sub_count:
          type: integer
          minimum: 1
          maximum: 5000
        integration_seconds:
          type: number
          description: 'Total exposure of the subs: `sub_count` × `exposure_seconds`.'
          exclusiveMinimum: 0
        first_captured_at:
          $ref: '#/components/schemas/Timestamp'
        last_captured_at:
          $ref: '#/components/schemas/Timestamp'
        subs:
          type: array
          items:
            $ref: '#/components/schemas/StackedSub'
          minItems: 1
          maxItems: 5000
          description: Every sub in the master. A sub may appear in only one credited master or sub.
        registration:
          $ref: '#/components/schemas/Text'
          description: For example "star alignment, Lanczos-3".
        normalization:
          $ref: '#/components/schemas/Text'
          description: For example "additive with scaling".
        rejection:
          $ref: '#/components/schemas/Text'
          description: For example "winsorized sigma clip, 3.0/3.0".
        weighting:
          $ref: '#/components/schemas/Text'
          description: For example "PSF signal weight".
        drizzle_scale:
          type: number
          minimum: 1
          maximum: 4
          description: Present when the master was drizzled.
        software:
          $ref: '#/components/schemas/Text'
        version:
          $ref: '#/components/schemas/Text'
      description: Provenance of a stacked master.
      additionalProperties: false
    StackedSub:
      type: object
      required:
      - origin_id
      - capture_id
      - captured_at
      - sha256
      properties:
        origin_id:
          $ref: '#/components/schemas/Uuid'
        capture_id:
          $ref: '#/components/schemas/Uuid'
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        sha256:
          $ref: '#/components/schemas/Sha256'
          description: SHA-256 of the calibrated sub as it entered the stack.
      description: One sub that went into a master.
      additionalProperties: false
    Submission:
      type: object
      required:
      - id
      - project_id
      - project_revision
      - state
      - created_at
      - manifest
      - uploads
      - artifacts
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        project_revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - uploading
          - processing
          - complete
        created_at:
          $ref: '#/components/schemas/Timestamp'
        manifest:
          $ref: '#/components/schemas/SubmissionCreate'
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UploadSession'
          minItems: 0
          maxItems: 100
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactResult'
          minItems: 1
          maxItems: 100
      additionalProperties: false
    SubmissionCreate:
      type: object
      required:
      - id
      - project_revision
      - artifacts
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_revision:
          type: integer
          minimum: 1
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactManifest'
          minItems: 1
          maxItems: 100
      description: A batch of files for one project. The client picks the `id`; repeating it returns the
        existing submission.
      additionalProperties: false
    Target:
      type: object
      required:
      - id
      - name
      - footprint
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
        footprint:
          $ref: '#/components/schemas/Footprint'
      additionalProperties: false
    Terms:
      type: object
      required:
      - id
      - version
      - url
      - sha256
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        url:
          $ref: '#/components/schemas/HttpsUrl'
        sha256:
          $ref: '#/components/schemas/Sha256'
      additionalProperties: false
    Text:
      type: string
      minLength: 1
      maxLength: 2000
    Timestamp:
      type: string
      pattern: Z$
      format: date-time
      description: RFC 3339 UTC timestamp ending in `Z`.
    UnsubmittedCaptures:
      type: object
      required:
      - panel_id
      - frames
      - integration_seconds
      properties:
        panel_id:
          $ref: '#/components/schemas/Uuid'
        frames:
          type: integer
          minimum: 0
        integration_seconds:
          type: number
          minimum: 0
        last_captured_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the most recent of these frames was captured.
      description: Frames captured for one panel and not yet submitted.
      additionalProperties: false
    UploadSession:
      type: object
      required:
      - id
      - submission_id
      - artifact_id
      - size_bytes
      - part_size_bytes
      - part_count
      - expires_at
      - received_parts
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        submission_id:
          $ref: '#/components/schemas/Uuid'
        artifact_id:
          $ref: '#/components/schemas/Uuid'
        size_bytes:
          type: integer
          minimum: 1
        part_size_bytes:
          type: integer
          minimum: 1
        part_count:
          type: integer
          minimum: 1
          maximum: 10000
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        received_parts:
          type: array
          items:
            $ref: '#/components/schemas/PartReceipt'
          minItems: 0
          maxItems: 10000
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: Bearer
      description: 'Send `Authorization: Bearer <api key>`. Each client installation gets its key by pairing.

        A key acts for its account, optionally limited to some projects. See

        spec/authentication.md.'
servers:
- url: https://collab.example/v1
  description: Reserved example; discover the real API root from the chosen service.
  variables: {}
