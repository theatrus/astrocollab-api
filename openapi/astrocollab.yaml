components:
  parameters:
    ChangesCursor:
      name: cursor
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      explode: false
    ConditionalRead:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 200
    CreateOrReplace.ifMatch:
      name: If-Match
      in: header
      required: false
      description: Supply exactly one of If-Match or If-None-Match.
      schema:
        type: string
        minLength: 3
        maxLength: 200
    CreateOrReplace.ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Create only. Supply exactly one of If-Match or If-None-Match.
      schema:
        type: string
        enum:
        - '*'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong ETag for the mutable resource; publication uses the draft ETag.
      schema:
        type: string
        minLength: 3
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      explode: false
    Paging.cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      explode: false
    RevisionQuery:
      name: revision
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      explode: false
  schemas:
    Activity:
      type: object
      required:
      - participation_id
      - writer_id
      - status
      - received_at
      - stale
      properties:
        participation_id:
          $ref: '#/components/schemas/Uuid'
        writer_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/StatusInput'
        received_at:
          $ref: '#/components/schemas/Timestamp'
        stale:
          type: boolean
      additionalProperties: false
    ActivityPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          maxLength: 4096
      additionalProperties: false
    Advice:
      type: object
      required:
      - action
      - demand_sequence
      - next_checkin_seconds
      - reason_codes
      properties:
        action:
          type: string
          enum:
          - recommendation_pending
          - keep_current
          - wait
          - review_required
          - unavailable
        demand_sequence:
          type: integer
          minimum: 0
        next_checkin_seconds:
          type: integer
          minimum: 30
          maximum: 86400
        reason_codes:
          type: array
          items:
            $ref: '#/components/schemas/Code'
          minItems: 0
          maxItems: 32
        job_id:
          $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            action:
              const: recommendation_pending
        then:
          required:
          - job_id
      additionalProperties: false
    AllowedRegion:
      type: object
      required:
      - target_id
      - center_region
      properties:
        target_id:
          $ref: '#/components/schemas/Uuid'
        center_region:
          $ref: '#/components/schemas/Footprint'
      description: Approved bounds for panel centers. A target ID alone does not authorize a new position.
      additionalProperties: false
    ArtifactManifest:
      type: object
      required:
      - id
      - origin_id
      - capture_id
      - objective_ids
      - processing_group_id
      - equipment
      - captured_at
      - exposure_seconds
      - filter_id
      - bandpass
      - format
      - size_bytes
      - sha256
      - calibration
      - measurements
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        origin_id:
          $ref: '#/components/schemas/Uuid'
        capture_id:
          $ref: '#/components/schemas/Uuid'
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        processing_group_id:
          $ref: '#/components/schemas/Uuid'
        equipment:
          $ref: '#/components/schemas/EquipmentRef'
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        exposure_seconds:
          type: number
          maximum: 86400
          exclusiveMinimum: 0
        filter_id:
          $ref: '#/components/schemas/Uuid'
        bandpass:
          $ref: '#/components/schemas/Bandpass'
        format:
          type: string
          enum:
          - fits
          - xisf
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
        calibration:
          $ref: '#/components/schemas/Calibration'
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
          minItems: 0
          maxItems: 100
        solve:
          $ref: '#/components/schemas/SolveEvidence'
        supersedes_artifact_id:
          $ref: '#/components/schemas/Uuid'
        recommendation_id:
          $ref: '#/components/schemas/Uuid'
        panel_id:
          $ref: '#/components/schemas/Uuid'
        delivery:
          type: string
          enum:
          - upload
          - external
          description: '`upload` sends bytes through an upload session. `external` registers a shared
            file.'
          default: upload
        external:
          $ref: '#/components/schemas/ExternalLocation'
          description: Where the file is shared. Required for, and only allowed with, external delivery.
        extensions:
          type: object
          unevaluatedProperties: {}
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)+$
      allOf:
      - if:
          properties:
            delivery:
              const: external
          required:
          - delivery
        then:
          required:
          - external
        else:
          not:
            required:
            - external
      additionalProperties: false
    ArtifactResult:
      type: object
      required:
      - artifact_id
      - state
      - reason_codes
      properties:
        artifact_id:
          $ref: '#/components/schemas/Uuid'
        state:
          type: string
          enum:
          - uploading
          - awaiting_retrieval
          - received
          - validating
          - accepted
          - rejected
          - superseded
        assessment_id:
          $ref: '#/components/schemas/Uuid'
        reason_codes:
          type: array
          items:
            $ref: '#/components/schemas/Text'
          minItems: 0
          maxItems: 32
      additionalProperties: false
    Assessment:
      type: object
      required:
      - id
      - submission_id
      - project_id
      - participation_id
      - origin_id
      - capture_id
      - artifact_id
      - policy_revision
      - decision
      - reasons
      - measurements
      - credits
      - assessed_at
      - assessor_id
      - event_sequence
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        submission_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        participation_id:
          $ref: '#/components/schemas/Uuid'
        origin_id:
          $ref: '#/components/schemas/Uuid'
        capture_id:
          $ref: '#/components/schemas/Uuid'
        artifact_id:
          $ref: '#/components/schemas/Uuid'
        policy_revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum:
          - accepted
          - rejected
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Text'
          minItems: 0
          maxItems: 32
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
          minItems: 0
          maxItems: 100
        credits:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
          minItems: 0
          maxItems: 100
        assessed_at:
          $ref: '#/components/schemas/Timestamp'
        assessor_id:
          $ref: '#/components/schemas/Uuid'
        event_sequence:
          type: integer
          minimum: 1
      allOf:
      - if:
          properties:
            decision:
              const: rejected
        then:
          properties:
            credits:
              maxItems: 0
            reasons:
              minItems: 1
      - if:
          properties:
            decision:
              const: accepted
        then:
          properties:
            credits:
              minItems: 1
      additionalProperties: false
    AssessmentInput:
      type: object
      required:
      - id
      - artifact_id
      - policy_revision
      - decision
      - reasons
      - measurements
      - credits
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        artifact_id:
          $ref: '#/components/schemas/Uuid'
        policy_revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum:
          - accepted
          - rejected
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Text'
          minItems: 0
          maxItems: 32
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
          minItems: 0
          maxItems: 100
        credits:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
          minItems: 0
          maxItems: 100
      allOf:
      - if:
          properties:
            decision:
              const: rejected
        then:
          properties:
            credits:
              maxItems: 0
            reasons:
              minItems: 1
      - if:
          properties:
            decision:
              const: accepted
        then:
          properties:
            credits:
              minItems: 1
      additionalProperties: false
    AssessmentPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          maxLength: 4096
      additionalProperties: false
    Availability:
      type: object
      required:
      - start
      - end
      properties:
        start:
          $ref: '#/components/schemas/Timestamp'
        end:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    Bandpass:
      type: object
      required:
      - name
      - center_nm
      - width_nm
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        center_nm:
          type: number
          minimum: 100
          maximum: 30000
        width_nm:
          type: number
          maximum: 30000
          exclusiveMinimum: 0
      additionalProperties: false
    Calibration:
      type: object
      required:
      - raw_sha256
      - masters
      - steps
      - pixel_unit
      - linear
      - color_state
      - registration
      properties:
        raw_sha256:
          $ref: '#/components/schemas/Sha256'
        masters:
          type: array
          items:
            $ref: '#/components/schemas/Master'
          minItems: 0
          maxItems: 16
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CalibrationStep'
          minItems: 1
          maxItems: 32
        pixel_unit:
          type: string
          enum:
          - adu
          - electrons
          - normalized
        adu_scale:
          type: number
          exclusiveMinimum: 0
        linear:
          type: boolean
        color_state:
          type: string
          enum:
          - mono
          - cfa
          - debayered_rgb
        registration:
          type: string
          enum:
          - unregistered
          - registered
      allOf:
      - if:
          properties:
            pixel_unit:
              const: normalized
        then:
          required:
          - adu_scale
      additionalProperties: false
    CalibrationStep:
      type: object
      required:
      - operation
      - software
      - version
      - parameters
      properties:
        operation:
          type: string
          enum:
          - bias_subtract
          - dark_subtract
          - flat_correct
          - dark_flat_correct
          - debayer
          - register
        software:
          $ref: '#/components/schemas/Text'
        version:
          $ref: '#/components/schemas/Text'
        parameters:
          type: object
          unevaluatedProperties:
            anyOf:
            - type: string
            - type: number
            - type: boolean
          maxProperties: 32
      additionalProperties: false
    Capabilities:
      type: object
      required:
      - server_id
      - api_root
      - protocol_versions
      - spec_version
      - features
      - account_url
      - artifact_formats
      - limits
      properties:
        server_id:
          $ref: '#/components/schemas/Uuid'
        api_root:
          $ref: '#/components/schemas/HttpsUrl'
        protocol_versions:
          type: array
          items:
            type: string
            enum:
            - v1
          minItems: 1
          maxItems: 100
        spec_version:
          type: string
          enum:
          - 0.1.0-draft.1
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureName'
          minItems: 0
          maxItems: 32
        account_url:
          $ref: '#/components/schemas/HttpsUrl'
          description: Account pages, where users sign up and create API keys.
        artifact_formats:
          type: array
          items:
            type: string
            enum:
            - fits
            - xisf
          minItems: 1
          maxItems: 2
        external_retrieval_hosts:
          type: array
          items:
            $ref: '#/components/schemas/Hostname'
          minItems: 1
          maxItems: 32
          description: 'Hosts this server fetches externally shared files from by itself. Absent means

            maintainers retrieve them by hand.'
        limits:
          $ref: '#/components/schemas/Limits'
      description: Public server description.
      additionalProperties: false
    Capacity:
      type: object
      required:
      - participation_id
      - revision
      - offer
      properties:
        participation_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
        offer:
          $ref: '#/components/schemas/CapacityInput'
      additionalProperties: false
    CapacityInput:
      type: object
      required:
      - month
      - timezone
      - offered_rig_seconds
      - equipment_ids
      - availability
      - mode
      - reported_attempted_rig_seconds
      - usage_observed_at
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        timezone:
          $ref: '#/components/schemas/Text'
        offered_rig_seconds:
          type: number
          minimum: 0
        equipment_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        availability:
          type: array
          items:
            $ref: '#/components/schemas/Availability'
          minItems: 0
          maxItems: 100
        mode:
          type: string
          enum:
          - soft
          - local_hard
        reported_attempted_rig_seconds:
          type: number
          minimum: 0
        usage_observed_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    Change:
      oneOf:
      - $ref: '#/components/schemas/ChangeUpsert'
      - $ref: '#/components/schemas/ChangeRemove'
    ChangePage:
      type: object
      required:
      - items
      - next_cursor
      - poll_after_seconds
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
          minItems: 0
          maxItems: 100
        next_cursor:
          type: string
          minLength: 1
          maxLength: 4096
        poll_after_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
    ChangeRemove:
      type: object
      required:
      - sequence
      - operation
      - kind
      - project_id
      - resource_id
      properties:
        sequence:
          type: integer
          minimum: 1
        operation:
          type: string
          enum:
          - remove
        kind:
          type: string
          enum:
          - project
          - project_revision
          - participation
          - progress
          - assessment
          - project_access
        project_id:
          $ref: '#/components/schemas/Uuid'
        resource_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    ChangeUpsert:
      type: object
      required:
      - sequence
      - operation
      - entry
      properties:
        sequence:
          type: integer
          minimum: 1
        operation:
          type: string
          enum:
          - upsert
        entry:
          $ref: '#/components/schemas/SyncResource'
      additionalProperties: false
    Checkin:
      type: object
      required:
      - equipment
      - capacity_revision
      - planning_policy_revision
      - captured_reported_frames
      - reported_attempted_rig_seconds
      - observed_at
      properties:
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentRef'
          minItems: 1
          maxItems: 100
        capacity_revision:
          type: integer
          minimum: 1
        planning_policy_revision:
          type: integer
          minimum: 1
        adopted_recommendation_id:
          $ref: '#/components/schemas/Uuid'
        captured_reported_frames:
          type: integer
          minimum: 0
        reported_attempted_rig_seconds:
          type: number
          minimum: 0
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    Code:
      type: string
      pattern: ^[a-z][a-z0-9_]+$
    Credit:
      type: object
      required:
      - objective_id
      - accepted_frames
      - accepted_integration_seconds
      - coverage_fraction
      - surplus
      properties:
        objective_id:
          $ref: '#/components/schemas/Uuid'
        accepted_frames:
          type: integer
          minimum: 0
          maximum: 1
        accepted_integration_seconds:
          type: number
          minimum: 0
        coverage_fraction:
          type: number
          minimum: 0
          maximum: 1
        surplus:
          type: boolean
      description: 'Per artifact/objective. Non-surplus accepted credit is one frame and its exposure;
        surplus

        contributes zero required credit.'
      allOf:
      - if:
          properties:
            surplus:
              const: true
        then:
          properties:
            accepted_frames:
              const: 0
            accepted_integration_seconds:
              const: 0
        else:
          properties:
            accepted_frames:
              const: 1
            accepted_integration_seconds:
              exclusiveMinimum: 0
      additionalProperties: false
    Equipment:
      type: object
      required:
      - id
      - participation_id
      - revision
      - observed_at
      - configuration
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        participation_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        configuration:
          $ref: '#/components/schemas/EquipmentInput'
      additionalProperties: false
    EquipmentInput:
      type: object
      required:
      - name
      - sensor_width_pixels
      - sensor_height_pixels
      - pixel_size_um
      - focal_length_mm
      - binning_x
      - binning_y
      - color_state
      - filters
      - rotation
      - confirmed_position_angle_degrees
      properties:
        name:
          $ref: '#/components/schemas/Text'
        sensor_width_pixels:
          type: integer
          minimum: 1
          maximum: 100000
        sensor_height_pixels:
          type: integer
          minimum: 1
          maximum: 100000
        pixel_size_um:
          type: number
          maximum: 1000
          exclusiveMinimum: 0
        focal_length_mm:
          type: number
          maximum: 100000
          exclusiveMinimum: 0
        binning_x:
          type: integer
          minimum: 1
          maximum: 16
        binning_y:
          type: integer
          minimum: 1
          maximum: 16
        color_state:
          type: string
          enum:
          - mono
          - cfa
          - debayered_rgb
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          minItems: 1
          maxItems: 100
        rotation:
          type: string
          enum:
          - fixed
          - manual
          - motorized
        confirmed_position_angle_degrees:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        site:
          $ref: '#/components/schemas/Site'
        extensions:
          type: object
          unevaluatedProperties: {}
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)+$
      additionalProperties: false
    EquipmentRef:
      type: object
      required:
      - equipment_id
      - revision
      properties:
        equipment_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    EquipmentRegistered:
      type: object
      required:
      - equipment
      - advice
      properties:
        equipment:
          $ref: '#/components/schemas/Equipment'
        advice:
          $ref: '#/components/schemas/Advice'
      additionalProperties: false
    ExposureRange:
      type: object
      required:
      - min_seconds
      - max_seconds
      properties:
        min_seconds:
          type: number
          maximum: 86400
          exclusiveMinimum: 0
        max_seconds:
          type: number
          maximum: 86400
          exclusiveMinimum: 0
      description: Server MUST enforce min_seconds <= max_seconds.
      additionalProperties: false
    ExternalDelivery:
      type: object
      required:
      - providers
      - instructions
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalProvider'
          minItems: 1
          maxItems: 6
          uniqueItems: true
        instructions:
          $ref: '#/components/schemas/Text'
          description: 'For example: "Share files with collab'
      description: File-sharing services a project accepts, and how contributors should share.
      additionalProperties: false
    ExternalLocation:
      type: object
      required:
      - provider
      - url
      - shared_at
      properties:
        provider:
          $ref: '#/components/schemas/ExternalProvider'
        url:
          $ref: '#/components/schemas/HttpsUrl'
          description: Link the project can open. It may grant access; treat it as private.
        reference:
          type: string
          minLength: 1
          maxLength: 1024
          description: Provider's file ID, when the link alone does not identify the file.
        shared_at:
          $ref: '#/components/schemas/Timestamp'
      description: A file shared outside the API. Visible only to the submitter and reviewing maintainers.
      additionalProperties: false
    ExternalProvider:
      type: string
      enum:
      - google_drive
      - dropbox
      - onedrive
      - box
      - s3
      - https
    FeatureName:
      type: string
      pattern: ^[a-z][a-z0-9_.-]{0,63}$
    Filter:
      type: object
      required:
      - id
      - bandpass
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bandpass:
          $ref: '#/components/schemas/Bandpass'
      additionalProperties: false
    Footprint:
      type: object
      required:
      - center
      - width_degrees
      - height_degrees
      - position_angle_degrees
      properties:
        center:
          $ref: '#/components/schemas/Position'
        width_degrees:
          type: number
          maximum: 30
          exclusiveMinimum: 0
        height_degrees:
          type: number
          maximum: 30
          exclusiveMinimum: 0
        position_angle_degrees:
          type: number
          minimum: 0
          exclusiveMaximum: 360
      additionalProperties: false
    Goal:
      type: object
      properties:
        accepted_frames:
          type: integer
          minimum: 1
        accepted_integration_seconds:
          type: number
          exclusiveMinimum: 0
      anyOf:
      - required:
        - accepted_frames
      - required:
        - accepted_integration_seconds
      additionalProperties: false
    Hostname:
      type: string
      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$
    HttpsUrl:
      type: string
      format: uri
      pattern: ^https://
    Intent:
      type: object
      required:
      - id
      - participation_id
      - revision
      - intent
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        participation_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
        intent:
          $ref: '#/components/schemas/IntentInput'
      additionalProperties: false
    IntentInput:
      type: object
      required:
      - project_revision
      - panels
      - estimated_rig_seconds
      - expires_at
      - state
      properties:
        project_revision:
          type: integer
          minimum: 1
        recommendation_id:
          $ref: '#/components/schemas/Uuid'
        planning_policy_revision:
          type: integer
          minimum: 1
        panels:
          type: array
          items:
            $ref: '#/components/schemas/Panel'
          minItems: 1
          maxItems: 100
        estimated_rig_seconds:
          type: number
          minimum: 0
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        state:
          type: string
          enum:
          - active
          - cancelled
      additionalProperties: false
    Job:
      type: object
      required:
      - id
      - kind
      - state
      - poll_after_seconds
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
          - recommendation
          - assessment
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        poll_after_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        result:
          oneOf:
          - $ref: '#/components/schemas/Recommendation'
          - $ref: '#/components/schemas/Submission'
        error:
          $ref: '#/components/schemas/Problem'
      allOf:
      - if:
          properties:
            state:
              const: succeeded
        then:
          required:
          - result
          not:
            required:
            - error
      - if:
          properties:
            state:
              const: failed
        then:
          required:
          - error
          not:
            required:
            - result
      - if:
          properties:
            state:
              enum:
              - queued
              - running
        then:
          not:
            anyOf:
            - required:
              - result
            - required:
              - error
      - if:
          properties:
            kind:
              const: recommendation
        then:
          properties:
            result:
              $ref: '#/components/schemas/Recommendation'
      - if:
          properties:
            kind:
              const: assessment
        then:
          properties:
            result:
              $ref: '#/components/schemas/Submission'
      additionalProperties: false
