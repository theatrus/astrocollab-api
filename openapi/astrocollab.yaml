      - format
      - size_bytes
      - sha256
      - calibration
      - measurements
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
          - calibrated_sub
          - stacked_master
          description: '`calibrated_sub` is one calibrated exposure. `stacked_master` combines many; see
            `stack`.'
          default: calibrated_sub
        origin_id:
          $ref: '#/components/schemas/Uuid'
          description: Capture identity of a sub. Masters carry it for each sub in `stack.subs`.
        capture_id:
          $ref: '#/components/schemas/Uuid'
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        processing_group_id:
          $ref: '#/components/schemas/Uuid'
        equipment:
          $ref: '#/components/schemas/EquipmentRef'
        captured_at:
          $ref: '#/components/schemas/Timestamp'
          description: Start of a sub's exposure. Masters use `stack` times instead.
        exposure_seconds:
          type: number
          maximum: 86400
          description: Exposure of a sub, or of each sub in a master. A master combines subs of one length.
          exclusiveMinimum: 0
        filter_id:
          $ref: '#/components/schemas/Uuid'
        bandpasses:
          type: array
          items:
            $ref: '#/components/schemas/Bandpass'
          minItems: 1
          maxItems: 8
          description: Passbands of the filter used. A dual-band frame can count toward two objectives.
        format:
          type: string
          enum:
          - fits
          - xisf
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
        calibration:
          $ref: '#/components/schemas/Calibration'
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
          minItems: 0
          maxItems: 100
        solve:
          $ref: '#/components/schemas/SolveEvidence'
        supersedes_artifact_id:
          $ref: '#/components/schemas/Uuid'
        assignment_id:
          $ref: '#/components/schemas/Uuid'
          description: The assignment and panel the frame was taken for.
        panel_id:
          $ref: '#/components/schemas/Uuid'
        delivery:
          type: string
          enum:
          - upload
          - external
          description: 'How the file arrives, for subs and masters alike: `upload` through an upload session,
            or `external` as a shared file.'
          default: upload
        external:
          $ref: '#/components/schemas/ExternalLocation'
          description: Where the file is shared. Required for, and only allowed with, external delivery.
        stack:
          $ref: '#/components/schemas/Stack'
          description: How a master was stacked, and from which subs. Required for, and only allowed with,
            masters.
        extensions:
          type: object
          unevaluatedProperties: {}
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)+$
      allOf:
      - if:
          properties:
            delivery:
              const: external
          required:
          - delivery
        then:
          required:
          - external
        else:
          not:
            required:
            - external
      - if:
          properties:
            kind:
              const: stacked_master
          required:
          - kind
        then:
          required:
          - stack
          properties:
            calibration:
              properties:
                registration:
                  const: registered
        else:
          required:
          - origin_id
          - capture_id
          - captured_at
          not:
            required:
            - stack
          properties:
            calibration:
              required:
              - raw_sha256
      additionalProperties: false
    ArtifactResult:
      type: object
      required:
