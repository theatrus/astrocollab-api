          maximum: 1
        surplus:
          type: boolean
      required:
      - objective_id
      - accepted_frames
      - accepted_integration_seconds
      - coverage_fraction
      - surplus
      description: Per artifact/objective. Non-surplus accepted credit is one frame and its exposure;
        surplus contributes zero required credit.
      allOf:
      - if:
          properties:
            surplus:
              const: true
        then:
          properties:
            accepted_frames:
              const: 0
            accepted_integration_seconds:
              const: 0
        else:
          properties:
            accepted_frames:
              const: 1
            accepted_integration_seconds:
              exclusiveMinimum: 0
