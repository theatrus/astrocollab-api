openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AstroCollab API
  version: 0.1.0-draft.1
  description: Draft independent collaborative astrophotography protocol. No target locks or equipment
    commands. See spec/protocol.md for normative lifecycle and authorization semantics.
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://collab.example/v1
  description: Reserved example; discover the real API root from the chosen service.
security:
- bearerAuth: []
tags:
- name: capabilities
- name: changes
- name: jobs
- name: me
- name: participations
- name: projects
- name: submissions
- name: sync
- name: uploads
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Discover service identity, limits and features
      tags:
      - capabilities
      security: []
      x-token-context: public
      x-required-scopes: []
      parameters:
      - $ref: '#/components/parameters/ConditionalRead'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Strong representation ETag.
              schema:
                type: string
              example: '"revision-1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                example:
                  value:
                    server_id: 00000000-0000-4000-8000-000000000099
                    api_root: https://collab.example/v1
                    protocol_versions:
                    - v1
                    spec_version: 0.1.0-draft.1
                    features:
                    - recommendations
                    account_url: https://collab.example/account
                    oauth_issuer: https://auth.collab.example
                    oauth_metadata_url: https://auth.collab.example/.well-known/oauth-authorization-server
                    account_resource: https://collab.example/v1/account
                    artifact_formats:
                    - fits
                    - xisf
                    limits:
                      max_json_bytes: 1048576
                      max_artifacts_per_submission: 100
                      max_artifact_bytes: 2147483648
                      max_chunk_bytes: 8388608
                      idempotency_retention_seconds: 86400
                      snapshot_ttl_seconds: 900
                      change_retention_seconds: 2592000
                      upload_staging_seconds: 604800
                      max_decoded_pixels: 200000000
        '304':
          description: Unchanged; no response body.
          headers:
            ETag:
              description: Strong representation ETag.
              schema:
                type: string
              example: '"revision-1"'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /projects:
    get:
      operationId: listProjects
      summary: Discover visible projects
      tags:
      - projects
      security:
      - {}
      - bearerAuth: []
      x-token-context: public_or_account
      x-required-scopes: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Strong representation ETag.
              schema:
                type: string
              example: '"revision-1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              examples:
                example:
                  value:
                    items:
                    - id: 00000000-0000-4000-8000-000000000001
                      owner_account_id: 00000000-0000-4000-8000-000000000050
                      title: M31 deep H-alpha
                      visibility: public
                      state: open
                      current_revision: 1
                      updated_at: '2026-10-04T04:00:00Z'
                    next_cursor: null
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: Anonymous requests see public listings. An optional account bearer token with account:read
        also exposes that account's memberships; invalid supplied credentials return 401.
    post:
      operationId: createProject
      summary: Create a draft project and owner membership
      tags:
      - projects
      security:
      - bearerAuth: []
      x-token-context: account
      x-required-scopes:
      - project:create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Success
          headers:
            ETag:
              description: Strong representation ETag.
              schema:
                type: string
              example: '"revision-1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
              examples:
                example:
                  value:
                    project:
                      id: 00000000-0000-4000-8000-000000000001
                      owner_account_id: 00000000-0000-4000-8000-000000000050
                      title: M31 deep H-alpha
                      visibility: members
                      state: draft
                      current_revision: null
                      updated_at: '2026-10-04T04:00:00Z'
                    owner_participation:
                      id: 00000000-0000-4000-8000-000000000051
                      project_id: 00000000-0000-4000-8000-000000000001
                      account_id: 00000000-0000-4000-8000-000000000050
                      role: owner
                      state: active
                      revision: 1
                      accepted_terms:
                        id: 00000000-0000-4000-8000-000000000019
                        version: 1
                        url: https://collab.example/terms/m31/1
                        sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                      updated_at: '2026-10-04T04:00:00Z'
        default:
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            examples:
              example:
                value:
                  id: 00000000-0000-4000-8000-000000000001
                  requirements:
                    title: M31 deep H-alpha
                    description: Calibrated linear mono data for the outer disk.
                    visibility: public
                    enrollment: open
                    state: open
                    targets:
                    - id: 00000000-0000-4000-8000-000000000004
                      name: M31 outer disk
                      footprint:
                        center:
                          ra_degrees: 10.6847
                          dec_degrees: 41.269
                        width_degrees: 3.0
                        height_degrees: 2.0
                        position_angle_degrees: 0
                    processing_groups:
                    - id: 00000000-0000-4000-8000-000000000006
                      name: Linear mono wide field
                      sampling_arcsec_per_pixel:
                        min: 1
                        max: 3
                      color_state: mono
                      registration: unregistered
                      linear: true
                      required_calibration_steps:
                      - dark_subtract
                      - flat_correct
                    objectives:
                    - id: 00000000-0000-4000-8000-000000000005
                      target_id: 00000000-0000-4000-8000-000000000004
                      processing_group_id: 00000000-0000-4000-8000-000000000006
                      bandpass:
                        name: H-alpha
                        center_nm: 656.3
                        width_nm: 3.0
                      purpose: deep
                      exposure:
                        min_seconds: 300
                        max_seconds: 600
                      goal:
                        accepted_frames: 120
                        accepted_integration_seconds: 36000
                      minimum_coverage_fraction: 0.95
                      fresh_pixel_solve: true
                      quality_rules:
                      - metric: fwhm
                        method: example.psf
                        method_version: '1'
                        unit: arcsec
                        required: false
                        max_value: 4.0
                      required_features: []
                    terms:
                      id: 00000000-0000-4000-8000-000000000019
                      version: 1
                      url: https://collab.example/terms/m31/1
                      sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    capture_deadline: '2026-12-01T00:00:00Z'
                    submission_deadline: '2026-12-15T00:00:00Z'
                    surplus_policy: retain_and_attribute
                    acceptance_policy_revision: 1
                    required_features: []
