components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Account OAuth token or project participation token, as required by x-token-context.
        Tokens are opaque to clients. x-required-scopes and resource ownership are normative.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 200
      example: '"revision-1"'
      description: Exactly one strong ETag for the mutable resource; publication uses the draft ETag.
    MaybeMatch:
      name: If-Match
      in: header
      schema:
        type: string
        minLength: 3
        maxLength: 200
      description: Supply exactly one of If-Match or If-None-Match.
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        const: '*'
      description: Create only. Supply exactly one of If-Match or If-None-Match.
    ConditionalRead:
      name: If-None-Match
      in: header
      schema:
        type: string
        minLength: 3
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    RevisionQuery:
      name: revision
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    participation_id:
      name: participation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    equipment_id:
      name: equipment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    intent_id:
      name: intent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    writer_id:
      name: writer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    submission_id:
      name: submission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    upload_id:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token_id:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    snapshot_id:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    job_id:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    part_number:
      name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
  responses:
    Problem:
      description: Protocol error; see status, stable code and request_id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://collab.example/problems/terms-consent-required
            title: Terms consent required
            status: 409
            code: terms_consent_required
            detail: Review the current project terms before finalizing.
            request_id: 00000000-0000-4000-8000-000000000090
    RateLimited:
      description: Quota or rate limit. Retry after the stated delay.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://collab.example/problems/rate-limited
            title: Rate limited
            status: 429
            code: rate_limited
            detail: Retry after the advertised delay.
            request_id: 00000000-0000-4000-8000-000000000090
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]+$
        detail:
          type: string
          minLength: 1
          maxLength: 2000
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              pointer:
                type: string
                minLength: 1
                maxLength: 2000
              code:
                type: string
                minLength: 1
                maxLength: 2000
            required:
            - pointer
            - code
          minItems: 0
          maxItems: 100
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
    Limits:
      type: object
      additionalProperties: false
      properties:
        max_json_bytes:
          type: integer
          minimum: 1024
        max_artifacts_per_submission:
          type: integer
          minimum: 1
          maximum: 100
        max_artifact_bytes:
          type: integer
          minimum: 1
        max_chunk_bytes:
          type: integer
          minimum: 1
        idempotency_retention_seconds:
          type: integer
          minimum: 86400
        snapshot_ttl_seconds:
          type: integer
          minimum: 60
        change_retention_seconds:
          type: integer
          minimum: 86400
        upload_staging_seconds:
          type: integer
          minimum: 3600
        max_decoded_pixels:
          type: integer
          minimum: 1
      required:
      - max_json_bytes
      - max_artifacts_per_submission
      - max_artifact_bytes
      - max_chunk_bytes
      - idempotency_retention_seconds
      - snapshot_ttl_seconds
      - change_retention_seconds
      - upload_staging_seconds
      - max_decoded_pixels
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
        api_root:
          type: string
          format: uri
          pattern: ^https://
        protocol_versions:
          type: array
          items:
            type: string
            enum:
            - v1
          minItems: 1
          maxItems: 100
        spec_version:
          type: string
          const: 0.1.0-draft.1
        features:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_.-]{0,63}$
          minItems: 0
          maxItems: 32
        account_url:
          type: string
          format: uri
          pattern: ^https://
        oauth_issuer:
          type: string
          format: uri
          pattern: ^https://
        oauth_metadata_url:
          type: string
          format: uri
          pattern: ^https://
        account_resource:
          type: string
          format: uri
          pattern: ^https://
