                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match its type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
      tags:
      - signin
  /api/v1/auth/poll:
    get:
      operationId: authPoll
      summary: Wait for the person to finish signing in
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
        explode: false
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPoll'
              examples:
                example:
                  value:
                    state: done
                    token: EXAMPLE_ONLY_TOKEN_02_xxxxxxxx
                    user:
                      id: '000000000000000042'
                      name: Vega Observatory
                      avatar: ''
                      admin: false
                      canStart: true
      tags:
      - signin
      security:
      - {}
  /api/v1/health:
    get:
      operationId: health
      summary: Check the server and its protocol
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                example:
                  value:
                    ok: true
                    protocol: 1
                    time: 1791171001.0
                    version: 0.2.23
                    adminConfigured: true
                    discord: true
                    roleRequired: false
      tags:
      - discovery
      security:
      - {}
  /api/v1/pair:
    post:
      operationId: pairTelescope
      summary: Pair a telescope with a code
      description: 'The other way to get a telescope token, for servers that list the `pairing` feature.
        The

        person issues a single-use code on the server''s web pages and types it into the program.

        Takes no token. Never retry on your own: a lost reply needs a new code.'
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelescopeCreated'
              examples:
                example:
                  value:
                    agent:
                      id: 000000000009
                      name: Vega 530
                      owner: Vega Observatory
                      owner_id: '000000000000000042'
                      created: 1791171016.0
                      seen: 0.0
                      profile: {}
                      presence: {}
                    token: EXAMPLE_ONLY_TOKEN_03_xxxxxxxx
        '401':
          description: Missing, unknown or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such thing, or not this caller's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match its type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
        '429':
          description: Too many tries, such as repeated bad pairing codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      tags:
      - telescopes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
            examples:
              example:
                value:
                  code: EXAMPLE-ONLY-PAIRING-CODE
                  name: Vega 530
      security:
      - {}
  /api/v1/presence:
    get:
      operationId: presence
      summary: See who is on the sky
      description: Telescopes that checked in during the last day, where they point and what they do.
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceResponse'
              examples:
                example:
                  value:
                    telescopes:
                    - id: '000000000001'
                      name: Vega 530 narrowband
                      enrolledAs: Vega 530
                      owner: Vega Observatory
                      ownerName: Vega Observatory
                      avatar: ''
                      ra: 0.7123
                      dec: 41.27
                      state: imaging
                      target: M31 halo in narrowband
                      project: '000000000002'
                      ageSeconds: 0
                      online: true
                    online: 1
                    people: 1
                    onlineSeconds: 1500
                    serverTime: 1791171045.0
        '401':
          description: Missing, unknown or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match its type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
      tags:
      - telescope
security:
- bearerAuth: []
components:
  schemas:
    AuthStatus:
      type: object
      required:
      - discord
      properties:
        discord:
          type: boolean
          description: True when sign-in is on. Starfront servers sign people in with Discord.
        guild:
          type: string
          description: The community people must belong to, if any.
        roleRequired:
          type: boolean
          description: Starting projects needs a role.
        publicUrl:
          type: string
      description: Whether people can sign in here.
    Cell:
      type: object
      required:
      - row
      - column
      properties:
        row:
          type: integer
          format: int32
        column:
          type: integer
          format: int32
      allOf:
      - $ref: '#/components/schemas/Region'
      description: One cell of a telescope's own tiling of a project, and where it sits in that grid.
    Compatibility:
      type: object
      required:
      - ok
      - certain
      - checks
      - summary
      properties:
        ok:
          type: boolean
        certain:
          type: boolean
          description: True when every check could be made.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityCheck'
        summary:
          type: string
      description: Whether a rig meets a project's requirements, check by check.
    CompatibilityCheck:
      type: object
      required:
      - check
      - ok
      - detail
      properties:
        check:
          type: string
        ok:
          anyOf:
          - type: boolean
          - type: 'null'
        detail:
          type: string
      description: One check of a rig against a project. `ok` is null when it cannot be told.
    Contribution:
      type: object
      properties:
        project:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: string
            enum:
            - ''
        task:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: string
            enum:
            - ''
        night:
          $ref: '#/components/schemas/NightName'
        filterName:
          type: string
        panel:
          type: string
          description: Which panel of the rig's tiling, as the rig numbers them; empty for a single frame.
        frames:
          type: integer
          format: int32
          default: 0
        seconds:
          type: number
          format: double
          description: Total exposure, seconds.
          default: 0
        exposure:
          type: number
          format: double
          description: Sub length, seconds.
          default: 0
        footprint:
          anyOf:
          - $ref: '#/components/schemas/Region'
          - type: 'null'
        scale:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Arcseconds per pixel.
        focalLength:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Millimetres.
        hfr:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean star size over the night, arcseconds.
        guideRms:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean guiding error over the night, arcseconds.
        moonIllumination:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: 0–1.
        moonSeparation:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Degrees.
        calibrated:
          type: boolean
          default: false
        bandpass:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Bandpass of the filter used, nanometres.
        colour:
          type: boolean
          default: false
      description: 'One night''s work on one filter and one panel, as measured rather than as planned.
        The

        footprint is the solved one: where the telescope really pointed.'
    DepthCell:
      type: object
      required:
      - ra
      - dec
      - width
      - height
      - row
      - column
      properties:
        ra:
          type: number
          format: double
        dec:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        row:
          type: integer
          format: int32
        column:
          type: integer
          format: int32
      description: One cell of a depth map's fine grid.
    DepthMap:
      type: object
      required:
      - project
      - name
      - region
      - columns
      - rows
      - cells
      - seconds
      - goals
      - progress
      properties:
        project:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        region:
          $ref: '#/components/schemas/Region'
        columns:
          type: integer
          format: int32
        rows:
          type: integer
          format: int32
        cells:
          type: array
          items:
            $ref: '#/components/schemas/DepthCell'
        seconds:
          type: object
          unevaluatedProperties:
            type: array
            items:
              type: number
              format: double
          description: Per filter, seconds on each cell, in the order of `cells`.
        goals:
          type: object
          unevaluatedProperties:
            type: number
            format: double
          description: Hours wanted per filter at every point.
        progress:
          type: object
          unevaluatedProperties:
            $ref: '#/components/schemas/FilterProgress'
      description: 'A project''s depth map: the region cut into a fine north-up grid, with everybody''s
        accepted

        seconds on each cell, per filter. Each accepted record credits the cells its footprint

        covers, in proportion to how much of each it covers.'
    EnrolRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What the owner calls this telescope.
        owner:
          type: string
          maxLength: 80
          default: ''
    ErrorBody:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
      description: An error. `detail` says what went wrong, in words to show the operator.
    FilterProgress:
      type: object
      required:
      - goalHours
      - atGoal
      - average
      - thinnest
      properties:
        goalHours:
          type: number
          format: double
          description: Depth wanted at every point, hours.
        atGoal:
          type: number
          format: double
          description: Share of the region at the goal depth (within a tenth of it), 0–1.
        average:
          type: number
          format: double
          description: The region's depth against the goal, each point capped at the goal, 0–1.
        thinnest:
          type: number
          format: double
          description: The least-covered point's depth against the goal, 0–1.
      description: How far one filter has got across the whole region, everybody's accepted data together.
    FilterTask:
      type: object
      required:
      - filter
      - exposure
      - hours
      properties:
        filter:
          type: string
        exposure:
          type: number
          format: double
          description: Sub length, seconds.
        hours:
          type: number
          format: double
          description: Depth wanted on each panel over all nights, hours.
      description: 'One filter''s part of a share: sub length, and depth wanted on each panel.'
    Health:
      type: object
      required:
      - ok
      - protocol
      - time
      - version
      properties:
        ok:
          type: boolean
        protocol:
          type: integer
          format: int32
          description: Protocol version, an integer. This draft is protocol 1.
        time:
          $ref: '#/components/schemas/UnixTime'
        version:
          type: string
          description: The server's own build version.
        features:
          type: array
          items:
            type: string
          description: Optional parts this server offers, such as `signin`, `pairing` or `files`.
      description: Whether the server is up, which protocol it speaks, and what it offers.
    HelloRequest:
      type: object
      properties:
        protocol:
          type: integer
          format: int32
          description: The protocol the program speaks.
          default: 1
        profile:
          $ref: '#/components/schemas/RigProfile'
        presence:
          anyOf:
          - $ref: '#/components/schemas/Presence'
          - type: 'null'
          description: Where the telescope points, for the others' charts. Optional.
    HelloResponse:
      type: object
      required:
      - agent
      - name
      - protocol
      - serverTime
      properties:
        agent:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        protocol:
          type: integer
          format: int32
        serverTime:
          $ref: '#/components/schemas/UnixTime'
    Id:
      type: string
      pattern: ^[0-9a-f]{12}$
      description: 'A server-made identifier: 12 lowercase hexadecimal characters.'
    JoinRequest:
      type: object
      properties:
        hours:
          type: number
          format: double
          minimum: 0
          maximum: 24
          description: Hours per filter to give, capped by the project's goal. 0 takes the goal.
          default: 0
        exposure:
          type: number
          format: double
          minimum: 0
          maximum: 3600
          description: Sub length for a filter with no entry in `exposures`. 0 takes the middle of the
            project's range.
          default: 0
        exposures:
          type: object
          unevaluatedProperties:
            type: number
            format: double
          description: The rig's own sub length per filter, seconds.
        night:
          $ref: '#/components/schemas/NightName'
          description: The night the rig is in, so the first deal is tonight's.
          default: ''
        moon:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          minimum: 0
          maximum: 1
          description: How much of the Moon is lit tonight, 0–1.
        moonUp:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          minimum: 0
          maximum: 1
          description: The fraction of the dark hours the Moon is up, 0–1.
    JoinResponse:
      type: object
      required:
      - task
      - requirements
      properties:
        task:
          anyOf:
          - $ref: '#/components/schemas/Task'
          - type: 'null'
        requirements:
          $ref: '#/components/schemas/Requirements'
        alreadyJoined:
          type: boolean
          description: The rig already held a share; that one is returned.
    LoginPoll:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - pending
          - done
          - claimed
          - expired
        token:
          type: string
        user:
          $ref: '#/components/schemas/SignedInUser'
      description: '`done` hands over the person''s token, once.'
    LoginStarted:
      type: object
      required:
      - code
      - url
      - expiresIn
      properties:
        code:
          type: string
        url:
          type: string
          description: Open this in the browser.
        expiresIn:
          type: integer
          format: int32
          description: Seconds the code stays good.
      description: 'A sign-in in progress: a code for the program to hold, and a page for the person to
        open.'
    Me:
      type: object
      required:
      - id
      - name
      - admin
      - canStart
      properties:
        id:
          type: string
        name:
          type: string
        admin:
          type: boolean
        canStart:
          type: boolean
    NightName:
      type: string
      maxLength: 16
      description: A night as the rig names it, such as `2026-10-05`.
    OpenProject:
      type: object
      required:
      - id
      - name
      - coordinator
      - ownerId
      - region
      - kind
      - requirements
      - goals
      - notes
      - compatibility
      - joined
      - collected
      - participants
      - participantsOnline
      - participantNames
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        coordinator:
          type: string
        ownerId:
          type: string
          description: Who started it.
        region:
          $ref: '#/components/schemas/Region'
        kind:
          type: string
          enum:
          - single
          - mosaic
          description: '`single`: one object everybody frames. `mosaic`: a region each rig tiles with
            its own camera.'
        requirements:
          $ref: '#/components/schemas/Requirements'
        goals:
          type: object
          unevaluatedProperties:
            type: number
            format: double
          description: Depth wanted at every point of the region, per filter, in hours.
        notes:
          type: string
        compatibility:
          $ref: '#/components/schemas/Compatibility'
          description: Whether this telescope can help, from the profile it last sent.
        joined:
          type: boolean
          description: This telescope already holds a share.
        collected:
          type: object
          unevaluatedProperties:
            type: number
            format: double
          description: Accepted hours so far, per filter.
        participants:
          type: integer
          format: int32
        participantsOnline:
          type: integer
          format: int32
        participantNames:
          type: array
          items:
            type: string
        progress:
          type: object
          unevaluatedProperties:
            $ref: '#/components/schemas/FilterProgress'
          description: Per filter, how far the region has got.
      description: An open project, as a telescope browsing for one sees it.
    OpenProjects:
      type: object
      required:
      - projects
      - protocol
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/OpenProject'
        protocol:
          type: integer
          format: int32
    PairRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
          description: The single-use code the person issued.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What to call this telescope.
      description: Trade a pairing code from the server's web pages for a telescope token.
    Presence:
      type: object
      properties:
        ra:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Hours.
        dec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Degrees.
        state:
          type: string
          description: Such as "imaging", "slewing" or "idle".
        target:
          type: string
          description: The target's name.
        project:
          type: string
          description: The project being shot, if any.
        telescope:
          type: string
          description: What to call the telescope on the group's chart, such as its equipment profile's
            name.
      description: Where a telescope points and what it is doing, as much as it chooses to say.
    PresenceResponse:
      type: object
      required:
      - telescopes
      - online
      - people
      - onlineSeconds
      - serverTime
      properties:
        telescopes:
          type: array
          items:
            $ref: '#/components/schemas/TelescopePresence'
        online:
          type: integer
          format: int32
          description: Telescopes online now.
        people:
          type: integer
          format: int32
          description: People with a telescope online now.
        onlineSeconds:
          type: integer
          format: int32
        serverTime:
          $ref: '#/components/schemas/UnixTime'
    Recorded:
      type: object
      required:
      - id
      - accepted
      - duplicate
      - verdict
      properties:
        id:
          $ref: '#/components/schemas/Id'
        accepted:
          type: boolean
        duplicate:
          type: boolean
          description: Already reported; the larger figure stands.
        verdict:
          $ref: '#/components/schemas/Verdict'
      description: What happened to one contribution in a report.
    Region:
      type: object
      required:
      - ra
      - dec
      - width
      - height
      properties:
        ra:
          type: number
          format: double
          description: Right ascension of the centre, degrees.
        dec:
          type: number
          format: double
          description: Declination of the centre, degrees.
        width:
          type: number
          format: double
          description: Width on the sky, degrees.
        height:
          type: number
          format: double
          description: Height on the sky, degrees.
        rotation:
          type: number
          format: double
          description: The position angle cameras should shoot at, degrees, so panels stack the same way
            up.
          default: 0
      description: 'A rectangle of sky, north-up. Degrees throughout: `ra` is degrees, not hours. `width`

        and `height` are angles on the sky, not degrees of the RA coordinate.'
    ReportRequest:
      type: object
      properties:
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/Contribution'
          maxItems: 200
          description: One record per night, filter and panel.
    ReportResponse:
      type: object
      required:
      - recorded
      properties:
        recorded:
          type: array
          items:
            $ref: '#/components/schemas/Recorded'
          description: In the order sent.
    Requirements:
      type: object
      properties:
        minFocalLength:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Millimetres.
        maxFocalLength:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Millimetres.
        minScale:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Arcseconds per pixel.
        maxScale:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Arcseconds per pixel.
        acceptColour:
          type: boolean
          description: Whether one-shot colour cameras may take part.
          default: true
        colourMaxMoon:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Moon illumination (0–1) above which a colour camera's night is refused.
        maxHfr:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean star size over a night, arcseconds.
        maxGuideRms:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean guiding error over a night, arcseconds.
        minExposure:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Shortest sub, seconds.
        maxExposure:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Longest sub, seconds.
        filters:
          type: object
          unevaluatedProperties:
            anyOf:
            - type: number
              format: double
            - type: 'null'
          description: Filters wanted, each to the widest bandpass accepted in nanometres, or null for
            any.
        maxMoonIllumination:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Moon illumination, 0–1.
        minMoonSeparation:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Degrees from the Moon.
        minAltitude:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Lowest altitude to shoot at, degrees.
        requireCalibrated:
          type: boolean
          description: Frames must be calibrated.
          default: false
        minFramesPerVisit:
          type: integer
          format: int32
          description: 'The fewest frames a visit to one panel is worth: a rig stacks its own frames.'
          default: 10
      description: 'What a project will take. Units mean the same on every rig: star size and guiding
        are in

        arcseconds, never pixels. Null means no limit.'
    RigProfile:
      type: object
      properties:
        name:
          type: string
        focalLength:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Millimetres.
        pixelSize:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Microns, unbinned.
        sensorWidth:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Pixels, unbinned.
        sensorHeight:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Pixels, unbinned.
        binning:
          type: integer
          format: int32
          default: 1
        filters:
          type: object
          unevaluatedProperties:
            anyOf:
            - type: number
              format: double
            - type: 'null'
          description: Filter name to bandpass in nanometres, or null where the bandpass is not known.
        colour:
          type: boolean
          description: 'A one-shot colour camera: broadband RGB, whatever is in front of it.'
          default: false
        rotation:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: 'The camera''s position angle in degrees when nothing can turn it. Null when a
            rotator can

            set whatever angle a project asks for.'
        typicalHfr:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Typical star size on this rig, arcseconds.
        typicalGuideRms:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Typical guiding error on this rig, arcseconds.
        exposures:
          type: object
          unevaluatedProperties:
            type: number
            format: double
          description: 'The sub length this rig shoots each filter at, seconds: what its darks are built
            for.

            Work is dealt at these lengths so every frame can be calibrated.'
        hoursPerNight:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Hours a night the rig gives the collaboration. Null means as long as targets are
            up.
        windowFrom:
          type: string
          description: Start of the rig's window, local clock time such as "21:00".
        windowTo:
          type: string
          description: End of the rig's window, local clock time.
        scale:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Arcseconds per pixel, worked out by the program from the optics.
        field:
          anyOf:
          - type: array
            items:
              type: number
              format: double
          - type: 'null'
          description: Field of view, [width, height] in degrees, worked out by the program.
      description: 'What a telescope is and what it achieves, sent with every hello. Numbers the program
        does

        not know are null. The server uses this to say whether the rig can help a project and to

        cut its cells and deal its nights.'
    SignedInUser:
      type: object
      required:
      - id
      - name
      - admin
      - canStart
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          type: string
        admin:
          type: boolean
        canStart:
          type: boolean
          description: May start projects on this server.
    SignedOut:
      type: object
      required:
      - signedOut
      properties:
        signedOut:
          type: boolean
    Task:
      type: object
      required:
      - id
      - project
      - region
      properties:
        id:
          $ref: '#/components/schemas/Id'
        project:
          $ref: '#/components/schemas/Id'
        projectName:
          type: string
        agent:
          $ref: '#/components/schemas/Id'
          description: The telescope this share belongs to.
        region:
          $ref: '#/components/schemas/Region'
          description: The whole project's sky.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterTask'
        state:
          type: string
          enum:
          - offered
          - accepted
          - declined
          - complete
          - superseded
          description: '`accepted` once the rig has joined or accepted it. `offered` when a coordinator
            pushed it

            and nobody has accepted yet. `superseded` when replaced by a newer share of the same project.'
          default: offered
        version:
          type: integer
          format: int32
          description: Rises whenever the share changes; a rig with this version has nothing new to do.
          default: 1
        issued:
          $ref: '#/components/schemas/UnixTime'
        note:
          type: string
        seconds:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Total seconds the share is worth over all nights.
        cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'
          description: This telescope's tiling of the region.
        share:
          type: array
          items:
            type: integer
            format: int32
          description: Indexes into `cells` to shoot tonight, in order.
        kind:
          type: string
          enum:
          - single
          - mosaic
          default: mosaic
        visit:
          anyOf:
          - $ref: '#/components/schemas/Visit'
          - type: 'null'
        assignedNight:
          anyOf:
          - $ref: '#/components/schemas/NightName'
          - type: 'null'
          description: The night the share was dealt for.
        assignedAt:
          anyOf:
          - $ref: '#/components/schemas/UnixTime'
          - type: 'null'
        dealtHours:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Hours of the night the share was dealt for.
        tiledRotation:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: The camera angle the cells were cut for.
      description: 'A telescope''s share of a project: the whole region tiled with its own camera, and
        which

        of those cells are its to shoot tonight. A change to the share bumps `version`.'
    TaskEnvelope:
      type: object
      required:
      - task
      properties:
        task:
          $ref: '#/components/schemas/Task'
    TaskResponse:
      type: object
      required:
      - task
      - tasks
      - version
      - protocol
      properties:
        task:
          anyOf:
          - $ref: '#/components/schemas/Task'
          - type: 'null'
          description: The first share, for programs that expect one.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        requirementsByProject:
          type: object
          unevaluatedProperties:
            $ref: '#/components/schemas/Requirements'
          description: Each share's project requirements, so the program can judge its own data first.
        version:
          type: integer
          format: int32
          description: The first share's version.
        protocol:
          type: integer
          format: int32
        requirements:
          $ref: '#/components/schemas/Requirements'
          description: The first share's project requirements.
      description: Every share this telescope holds, each dealt for tonight.
    TaskStateRequest:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - accepted
          - declined
          - complete
    Telescope:
      type: object
      required:
      - id
      - name
      - created
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        owner:
          type: string
          description: The owner's display name.
        owner_id:
          type: string
        created:
          $ref: '#/components/schemas/UnixTime'
        seen:
          $ref: '#/components/schemas/UnixTime'
          description: Last check-in, or 0 if never.
        profile:
          $ref: '#/components/schemas/RigProfile'
        presence:
          anyOf:
          - $ref: '#/components/schemas/Presence'
          - type: 'null'
      description: An enrolled telescope. The token is never listed.
    TelescopeCreated:
      type: object
      required:
      - agent
      - token
      properties:
        agent:
          $ref: '#/components/schemas/Telescope'
        token:
          type: string
      description: A telescope's credential. The token is shown once; keep it on that telescope.
    TelescopeList:
      type: object
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Telescope'
    TelescopePresence:
      type: object
      required:
      - id
      - name
      - owner
      - ra
      - dec
      - state
      - target
      - project
      - ageSeconds
      - online
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: What the telescope says to call it, or the name it was enrolled under.
        enrolledAs:
          type: string
          description: The name it was enrolled under.
        owner:
          type: string
        ra:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Hours.
        dec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Degrees.
        state:
          type: string
        target:
          type: string
        project:
          type: string
        ageSeconds:
          type: integer
          format: int32
          description: Seconds since it last checked in.
        online:
          type: boolean
          description: Checked in within `onlineSeconds`.
      description: One telescope as the group sees it.
    UnixTime:
      type: number
      format: double
      minimum: 0
      description: Seconds since 1970-01-01 UTC, as a number.
    ValidationErrorBody:
      type: object
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  anyOf:
                  - type: string
                  - type: integer
                    format: int32
              msg:
                type: string
              type:
                type: string
            required:
            - loc
            - msg
            - type
      description: A request body that does not match its type. Each entry names a field and the problem.
    Verdict:
      type: object
      required:
      - accepted
      properties:
        accepted:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        unverified:
          type: array
          items:
            type: string
        summary:
          type: string
        overriddenBy:
          anyOf:
          - type: string
          - type: 'null'
        overrideReason:
          anyOf:
          - type: string
          - type: 'null'
      description: 'The server''s judgement of one contribution. Advisory: a project''s coordinator can
        overrule

        it. `unverified` lists rules that could not be checked because a measurement was missing.'
    Visit:
      type: object
      properties:
        seconds:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Seconds to spend on each panel tonight.
        frames:
          type: object
          unevaluatedProperties:
            type: integer
            format: int32
          description: Frames per filter on each panel tonight.
        filter:
          anyOf:
          - type: string
          - type: 'null'
          description: Tonight's one filter, on a mosaic.
        moon:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: How much the Moon spoils the night the list was made for, 0–1.
      description: Tonight's slice of a share.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: Bearer
      description: 'Send `Authorization: Bearer <token>`. Telescope routes take a telescope''s agent token;

        account routes take a person''s token from sign-in. The two are never interchangeable.'
servers:
- url: https://collab.example
  description: Reserved example; use the address of the server you join.
  variables: {}
